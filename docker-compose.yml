# Compose único de produção, executado pelo Dokploy (recurso do tipo "Docker Compose").
#
# - Sem porta publicada no host e sem Nginx. O domínio e o HTTPS ficam com o
#   Traefik do Dokploy, configurados na aba "Domains" do Dokploy para o serviço
#   fabrica-museu-web, porta 3000.
# - Sem container_name: o Dokploy dá nomes próprios aos containers.
# - As fotos do acervo ficam numa pasta fixa da VPS (MUSEU_HOST_DIR, padrão
#   /srv/fabrica-museu, com as fotos em photos/), fora do código: o Dokploy
#   clona o repositório de novo a cada deploy. A pasta é criada pelo serviço
#   "preparar-pasta", não é preciso criá-la à mão.
# - Desenvolvimento: docker-compose.dev.yml.
#
name: fabrica-museu

services:
  preparar-pasta:
    # Roda a cada deploy, antes do web, e termina. O Docker cria a pasta do host
    # (MUSEU_HOST_DIR) se ela não existir, mas como root; aqui ela e a subpasta
    # photos passam para o UID/GID 1000 (o usuário node do container e, em geral,
    # o primeiro usuário comum da VPS), que pode copiar fotos sem sudo.
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      - mkdir -p /dados/photos && chown -R 1000:1000 /dados && chmod -R u+rwX,go+rX /dados
    volumes:
      - "${MUSEU_HOST_DIR:-/srv/fabrica-museu}:/dados"
    network_mode: none
    # Só as capacidades de criar a subpasta, trocar o dono e ajustar permissões
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE

  fabrica-museu-web:
    build:
      context: .
      target: prod
      args:
        IMAGE_TAG: ${IMAGE_TAG:-latest}
        IMAGE_NAME: fabrica-museu:${IMAGE_TAG:-latest}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: fabrica-museu:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      # Atrás do Traefik: o IP real vem no X-Forwarded-For (o rate limit depende disso)
      - TRUST_PROXY=true
      - PHOTOS_HOST_PATH=/app/src/public/photos
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - IMAGE_NAME=fabrica-museu:${IMAGE_TAG:-latest}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_DATE=${BUILD_DATE:-unknown}
    volumes:
      # Pasta fixa da VPS com as fotos e thumbnails do acervo (só leitura)
      - "${MUSEU_HOST_DIR:-/srv/fabrica-museu}/photos:/app/src/public/photos:ro"
    depends_on:
      preparar-pasta:
        condition: service_completed_successfully
    init: true
    # Sem "ports": o Traefik do Dokploy alcança a porta 3000 pela dokploy-network
    expose:
      - "3000"
    labels:
      - org.opencontainers.image.version=${IMAGE_TAG:-latest}
    networks:
      - default
      - dokploy-network
    restart: unless-stopped
    stop_grace_period: 20s
    # Sistema de arquivos só leitura; escrita apenas em tmpfs
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /app/tmp:size=64M,mode=1777
    # Sem ganhar privilégios depois de iniciar (setuid) e sem as capacidades de root que não usa
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A imagem slim não tem wget/curl; o node faz a requisição
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 256
        reservations:
          cpus: "0.10"
          memory: 192M
    # Logs do Docker giram em até 3 arquivos de 10 MB (sem isso crescem até encher o disco)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Rede do Traefik do Dokploy (criada na instalação do Dokploy)
  dokploy-network:
    external: true
